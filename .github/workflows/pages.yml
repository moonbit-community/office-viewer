name: Build and deploy Office Viewer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: office-viewer
    steps:
      - uses: actions/checkout@v4
        with:
          path: office-viewer
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: office-viewer/package-lock.json
      - name: Install browser dependencies
        run: npm ci --ignore-scripts
      - name: Install pinned official MoonBit toolchain
        env:
          MOONBIT_VERSION: 0.10.15%2B943464bfa
        run: |
          export MOON_HOME="$RUNNER_TEMP/moon"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          mkdir -p "$MOON_HOME/lib"
          curl --fail --location --retry 3 "https://cli.moonbitlang.com/binaries/$MOONBIT_VERSION/moonbit-linux-x86_64.tar.gz" -o "$RUNNER_TEMP/moonbit.tar.gz"
          echo "24b93a5409d2a4fb8e3d1b84b473f27b63476cef4418094764df96cb26b03c09  $RUNNER_TEMP/moonbit.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/moonbit.tar.gz" -C "$MOON_HOME"
          chmod +x "$MOON_HOME"/bin/* "$MOON_HOME/bin/internal/tcc"
          curl --fail --location --retry 3 "https://cli.moonbitlang.com/cores/core-$MOONBIT_VERSION.tar.gz" -o "$RUNNER_TEMP/core.tar.gz"
          echo "96d30f4dbcc6a9e1736ef26fbdd0e8fb0e97cb01d50e55d2a0072208b8061ae5  $RUNNER_TEMP/core.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/core.tar.gz" -C "$MOON_HOME/lib"
          export PATH="$MOON_HOME/bin:$PATH"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
          moon -C "$MOON_HOME/lib/core" bundle --warn-list -a --all
          moon -C "$MOON_HOME/lib/core" bundle --warn-list -a --target wasm-gc --quiet
          moon version --all
      - name: Resolve published dependencies
        run: moon update
      - name: Check and test
        run: |
          moon check --target js
          moon test --target js
      - name: Test browser interactions in Chromium
        run: |
          npx --no-install playwright install --with-deps chromium
          npm run test:browser
      - name: Install pinned Warren builder
        run: moon install moonbit-community/warren@0.4.5 --bin "$MOON_HOME/bin"
      - name: Build Pages artifact from source
        run: |
          moon run tools/prepare-browser-assets.mbtx
          npm run build:pages
      - name: Test shipped browser entry
        run: npm run test:production
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: office-viewer/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
